<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from './node_modules/three/build/three.module.js';
    import { renderEffectClone } from './standalone-bundle.js';

    window.run = async (effectId, size, pakPath) => {
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true,
        preserveDrawingBuffer: true
      });

      const res = await renderEffectClone({
        pakPath: pakPath || './hun0fx.pak',
        effectId,
        size,
        renderer
      });

      return {
        ok: true,
        b64: btoa(Array.from(res.gifBytes, b => String.fromCharCode(b)).join('')),
        frames: res.frameCount
      };
    };
  </script>
</body>
</html>
